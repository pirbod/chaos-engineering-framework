apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: platform-chaos-reliability-hub
  title: Platform Chaos Reliability Hub
  description: Developer entry point for safe resilience experiments, risk scoring, runbooks and observability.
  annotations:
    github.com/project-slug: pirbod/chaos-engineering-framework
    backstage.io/techdocs-ref: dir:..
    grafana/dashboard-selector: platform-chaos-hub
    datadoghq.com/dashboard-url: https://app.datadoghq.com/dashboard/platform-chaos-hub
  tags:
    - platform
    - chaos-engineering
    - reliability
    - gitops
spec:
  type: service
  lifecycle: experimental
  owner: group:platform-engineering
  system: platform-reliability
  providesApis:
    - platform-chaos-hub-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: platform-chaos-hub-api
  description: REST API for experiment catalog, service risk, integrations and AI incident summaries.
spec:
  type: openapi
  lifecycle: experimental
  owner: group:platform-engineering
  definition:
    $text: ../docs/api/openapi.yaml
