<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Test Results Screenshot</title>
  <desc id="desc">Terminal-style screenshot of validation results for the Platform Chaos Reliability Hub repository.</desc>
  <rect width="1280" height="720" fill="#0f1720"/>
  <rect x="52" y="44" width="1176" height="632" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <rect x="52" y="44" width="1176" height="48" rx="10" fill="#1f2937"/>
  <circle cx="82" cy="68" r="7" fill="#ef4444"/>
  <circle cx="106" cy="68" r="7" fill="#f59e0b"/>
  <circle cx="130" cy="68" r="7" fill="#22c55e"/>
  <text x="164" y="73" font-family="Consolas, 'Liberation Mono', monospace" font-size="18" fill="#dbeafe">platform-chaos-hub validation</text>

  <text x="84" y="132" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#93c5fd">$ git diff --check</text>
  <text x="84" y="166" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#86efac">PASS</text>

  <text x="84" y="220" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#93c5fd">$ python3 -m json.tool monitoring/grafana/platform-chaos-dashboard.json</text>
  <text x="84" y="254" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#86efac">JSON validation: PASS</text>

  <text x="84" y="308" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#93c5fd">$ python3 YAML parser for non-Helm-templated YAML files</text>
  <text x="84" y="342" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#86efac">YAML validation: PASS</text>

  <text x="84" y="396" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#93c5fd">$ make test</text>
  <text x="84" y="430" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#fde68a">Go is not installed; skipping backend tests in this environment.</text>
  <text x="84" y="464" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#d1d5db">cd frontend &amp;&amp; npm test</text>
  <text x="84" y="498" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#d1d5db">&gt; platform-chaos-hub-frontend@0.1.0 test</text>
  <text x="84" y="532" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#d1d5db">&gt; vitest run --environment jsdom</text>
  <text x="84" y="566" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#fecaca">sh: 1: vitest: not found</text>
  <text x="84" y="600" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" fill="#fecaca">make: *** [Makefile:17: test] Error 127</text>

  <text x="84" y="646" font-family="Consolas, 'Liberation Mono', monospace" font-size="18" fill="#94a3b8">Note: npm registry access was restricted, so frontend dependencies and package-lock could not be generated locally.</text>
