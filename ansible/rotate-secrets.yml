---
- name: Rotate integration secrets safely
  hosts: platform
  gather_facts: false
  vars:
    rotation_targets:
      - vault
      - gitlab
      - datadog
  tasks:
    - name: Confirm rotation target list
      ansible.builtin.debug:
        msg: "Preparing rotation workflow for {{ rotation_targets | join(', ') }}."

    - name: Document Vault rotation checkpoint
      ansible.builtin.debug:
        msg:
          - "Create a new scoped Vault token or Kubernetes auth role."
          - "Update the consuming secret reference through GitOps."
          - "Verify leases and revoke the previous token after consumers refresh."

    - name: Document GitLab rotation checkpoint
      ansible.builtin.debug:
        msg:
          - "Create a least-privilege project or group token."
          - "Update CI variables through protected settings."
          - "Run validation pipeline before revoking the previous token."

    - name: Document Datadog rotation checkpoint
      ansible.builtin.debug:
        msg:
          - "Create a scoped API/application key."
          - "Update the platform secret store."
          - "Send a test chaos event and verify tags before revoking old key."
