apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-playbook
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/chaos-engineering-framework.git'
    path: 'chaos-playbook'
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: litmus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
