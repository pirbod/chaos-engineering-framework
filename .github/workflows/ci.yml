name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Format
        run: gofmt -w backend
      - name: Test
        working-directory: backend
        run: go test ./...

  frontend:
    name: TypeScript frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  validate-assets:
    name: YAML and JSON assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python -m json.tool monitoring/grafana/platform-chaos-dashboard.json >/dev/null
          python -m json.tool monitoring/datadog/monitors.json >/dev/null
      - name: List chaos manifests
        run: find chaos-playbook -name '*.yaml' -maxdepth 1 -print
