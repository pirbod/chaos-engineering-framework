apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-chaos-hub.fullname" . }}-config
  labels:
    {{- include "platform-chaos-hub.labels" . | nindent 4 }}
data:
  AI_PROVIDER: {{ .Values.backend.env.AI_PROVIDER | quote }}
  VERSION: {{ .Values.backend.env.VERSION | quote }}
  VITE_API_BASE_URL: {{ .Values.frontend.env.VITE_API_BASE_URL | quote }}
