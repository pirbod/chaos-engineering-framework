apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-chaos-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/pirbod/chaos-engineering-framework.git'
    path: argocd
    targetRevision: main
    directory:
      recurse: false
      exclude: app-of-apps.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
